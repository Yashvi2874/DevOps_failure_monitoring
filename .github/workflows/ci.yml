# Continuous integration on GitHub. Jenkins does the deployment; this workflow
# gives every push and pull request a quick pass/fail check on GitHub itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: flake8
        working-directory: app
        run: flake8
      - name: pytest
        working-directory: app
        run: pytest -v --cov=sensor_dashboard --cov-report=term
      - name: Alert receiver tests
        working-directory: monitoring/alert-receiver
        run: python -m unittest -v

  stack:
    name: Build images and smoke test the stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build all images
        run: docker compose build
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool sensor-prometheus:latest check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool sensor-prometheus:latest test rules /etc/prometheus/tests/alert_rules_test.yml
      - name: Validate Alertmanager config and routing
        run: |
          docker run --rm --entrypoint amtool sensor-alertmanager:latest check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool sensor-alertmanager:latest config routes test \
            --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=on-call-pager severity=critical
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: docker run --rm -i --network sensor-net sensor-dashboard:latest python - < scripts/smoke_test.py
      - name: Show container logs
        if: failure()
        run: docker compose logs --tail 100
