global:
  # alerts pushed by Jenkins resolve on their own if not refreshed
  resolve_timeout: 5m

route:
  receiver: team-chat
  # one message per sensor (high CO2 + high PM2.5 arrive together);
  # job keeps Jenkins alerts separate from dashboard alerts
  group_by: ["job", "sensor"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2h
  routes:
    - matchers: ['severity="critical"']
      receiver: on-call-pager
      group_wait: 5s
      repeat_interval: 30m

receivers:
  - name: team-chat
    webhook_configs:
      - url: http://alert-receiver:5001/hooks/team-chat
        send_resolved: true

  - name: on-call-pager
    webhook_configs:
      - url: http://alert-receiver:5001/hooks/on-call-pager
        send_resolved: true

inhibit_rules:
  # app down: hide the warnings it causes
  - source_matchers: ['alertname="SensorDashboardDown"']
    target_matchers: ['severity=~"warning|info"']
    equal: ["job"]

  # an offline sensor's last temperature is stale
  - source_matchers: ['alertname="SensorOffline"']
    target_matchers: ['alertname="SensorOverheat"']
    equal: ["sensor"]
