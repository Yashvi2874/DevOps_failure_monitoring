global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: sensor-dashboard

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: sensor-dashboard
    static_configs:
      - targets: ["dashboard:8000"]
        labels:
          app: sensor-dashboard

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
