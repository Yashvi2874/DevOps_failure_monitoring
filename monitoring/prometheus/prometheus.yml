# Prometheus pulls ("scrapes") metrics from every target below every 5 seconds
# and checks the alert rules just as often.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: sensor-dashboard

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The app we are monitoring. "dashboard" is the service name in
  # docker-compose.yml; Docker's network turns it into the container's IP.
  - job_name: sensor-dashboard
    static_configs:
      - targets: ["dashboard:8000"]
        labels:
          app: sensor-dashboard

  # The monitoring tools watch themselves too.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
