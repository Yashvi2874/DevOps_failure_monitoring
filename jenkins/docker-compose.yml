# Jenkins runs in its own container, separate from the app stack it deploys.
#
#   cd jenkins
#   cp .env.example .env        then set a password in .env
#   docker compose up -d --build
#
# Then open http://localhost:8080 (or whatever JENKINS_PORT is).
name: sensor-jenkins

services:
  jenkins:
    build: .
    image: sensor-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    # The Docker socket is owned by group 0 on Docker Desktop. On a Linux host
    # set DOCKER_GID to the gid of the "docker" group instead.
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_URL: http://localhost:${JENKINS_PORT:-8080}/
      PIPELINE_REPO_URL: ${PIPELINE_REPO_URL:-https://github.com/Yashvi2874/DevOps_failure_monitoring.git}
      # Where the pipeline reports its own failures
      ALERTMANAGER_URL: http://host.docker.internal:9093
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
