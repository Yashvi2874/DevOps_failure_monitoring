name: sensor-jenkins

services:
  jenkins:
    build: .
    image: sensor-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    # the Docker socket belongs to group 0 on Docker Desktop;
    # on Linux set DOCKER_GID to the docker group's gid
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_URL: http://localhost:${JENKINS_PORT:-8080}/
      PIPELINE_REPO_URL: ${PIPELINE_REPO_URL:-https://github.com/Yashvi2874/DevOps_failure_monitoring.git}
      ALERTMANAGER_URL: http://host.docker.internal:9093
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
