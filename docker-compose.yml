# The whole running system: the app plus everything that watches it.
#
#   docker compose up -d --build     start (or update) everything
#   docker compose ps                see what is running
#   docker compose down              stop and remove the containers
#
# Jenkins deploys with this same file, passing IMAGE_TAG=<build number>.
name: sensor-monitoring

services:
  dashboard:
    image: sensor-dashboard:${IMAGE_TAG:-latest}
    build:
      context: ./app
      target: runtime
    container_name: sensor-dashboard
    restart: unless-stopped
    environment:
      ALERTMANAGER_URL: http://alertmanager:9093
      ENABLE_SIMULATION: "true"
      # Only ever true when Jenkins is asked to simulate a broken release.
      FORCE_UNHEALTHY: ${FORCE_UNHEALTHY:-false}
    ports:
      - "8000:8000"

  prometheus:
    image: sensor-prometheus:latest
    build: ./monitoring/prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus

  alertmanager:
    image: sensor-alertmanager:latest
    build: ./monitoring/alertmanager
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager

  alert-receiver:
    image: sensor-alert-receiver:latest
    build: ./monitoring/alert-receiver
    container_name: alert-receiver
    restart: unless-stopped
    environment:
      FORWARD_WEBHOOK_URL: ${FORWARD_WEBHOOK_URL:-}
    ports:
      - "5001:5001"

networks:
  default:
    # A fixed name so the Jenkins smoke test can join this network.
    name: sensor-net

volumes:
  prometheus-data:
  alertmanager-data:
