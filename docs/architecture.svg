<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .lbl { font-size: 13px; fill: #334155; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; }
      .dash { stroke: #0f766e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .red { stroke: #b91c1c; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .chip { fill: #e0f2fe; stroke: #7dd3fc; }
      .chip-red { fill: #fee2e2; stroke: #fca5a5; }
      .chiptext { font-size: 12.5px; fill: #0c4a6e; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>

  <!-- top row: source control and CI -->
  <rect class="box" x="30" y="55" width="160" height="70" rx="10"/>
  <text class="title" x="110" y="86" text-anchor="middle">Developer</text>
  <text class="sub" x="110" y="106" text-anchor="middle">commits code</text>

  <rect class="box" x="270" y="55" width="210" height="70" rx="10"/>
  <text class="title" x="375" y="86" text-anchor="middle">GitHub repository</text>
  <text class="sub" x="375" y="106" text-anchor="middle">single source of truth</text>

  <rect class="box" x="270" y="175" width="210" height="62" rx="10"/>
  <text class="title" x="375" y="202" text-anchor="middle">GitHub Actions</text>
  <text class="sub" x="375" y="222" text-anchor="middle">lint, tests, stack smoke test</text>

  <rect class="box" x="590" y="25" width="580" height="200" rx="12"/>
  <text class="title" x="610" y="53">Jenkins (container, configured as code)</text>
  <text class="sub" x="610" y="73">runs the Jenkinsfile; drives Docker through /var/run/docker.sock</text>
  <rect class="chip" x="610" y="92" width="120" height="30" rx="6"/><text class="chiptext" x="670" y="112" text-anchor="middle">1. Checkout</text>
  <rect class="chip" x="740" y="92" width="130" height="30" rx="6"/><text class="chiptext" x="805" y="112" text-anchor="middle">2. Build &amp; Test</text>
  <rect class="chip" x="880" y="92" width="160" height="30" rx="6"/><text class="chiptext" x="960" y="112" text-anchor="middle">3. Validate Monitoring</text>
  <rect class="chip" x="610" y="132" width="120" height="30" rx="6"/><text class="chiptext" x="670" y="152" text-anchor="middle">4. Build Image</text>
  <rect class="chip" x="740" y="132" width="130" height="30" rx="6"/><text class="chiptext" x="805" y="152" text-anchor="middle">5. Deploy</text>
  <rect class="chip" x="880" y="132" width="160" height="30" rx="6"/><text class="chiptext" x="960" y="152" text-anchor="middle">6. Smoke Test</text>
  <rect class="chip-red" x="880" y="172" width="270" height="30" rx="6"/><text class="chiptext" x="1015" y="192" text-anchor="middle" fill="#7f1d1d">smoke test fails: roll back to :stable</text>
  <text class="sub" x="610" y="192">tests fail: stop, nothing deployed</text>

  <path class="line" d="M190 90 L266 90" marker-end="url(#arrow)"/>
  <text class="lbl" x="228" y="80" text-anchor="middle">git push</text>
  <path class="line" d="M480 90 L586 90" marker-end="url(#arrow)"/>
  <text class="lbl" x="533" y="80" text-anchor="middle">polled every</text>
  <text class="lbl" x="533" y="110" text-anchor="middle">minute</text>
  <path class="line" d="M375 125 L375 171" marker-end="url(#arrow)"/>
  <text class="lbl" x="385" y="153">on push</text>

  <!-- Docker host -->
  <rect x="30" y="285" width="1140" height="410" rx="14" fill="#eef6ff" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text class="title" x="50" y="313" fill="#1e3a8a">Docker host, Compose project "sensor-monitoring", network sensor-net</text>

  <path class="line" d="M760 225 L760 281" marker-end="url(#arrow)"/>
  <text class="lbl" x="770" y="258">docker compose up -d (IMAGE_TAG = build number)</text>

  <rect class="box" x="60" y="380" width="290" height="130" rx="10"/>
  <text class="title" x="80" y="410">sensor-dashboard  :8000</text>
  <text class="sub" x="80" y="433">Flask + gunicorn, 3 simulated sensors</text>
  <text class="sub" x="80" y="453">/ (page)   /api/*   /health</text>
  <text class="sub" x="80" y="473">/metrics for Prometheus</text>
  <text class="sub" x="80" y="493">Docker HEALTHCHECK, restart policy</text>

  <rect class="box" x="455" y="380" width="290" height="130" rx="10"/>
  <text class="title" x="475" y="410">Prometheus  :9090</text>
  <text class="sub" x="475" y="433">scrapes every 5 seconds</text>
  <text class="sub" x="475" y="453">stores time series (7 days)</text>
  <text class="sub" x="475" y="473">evaluates 7 alert rules</text>
  <text class="sub" x="475" y="493">(down, overheat, offline, ...)</text>

  <rect class="box" x="850" y="380" width="290" height="130" rx="10"/>
  <text class="title" x="870" y="410">Alertmanager  :9093</text>
  <text class="sub" x="870" y="433">groups alerts per job and sensor</text>
  <text class="sub" x="870" y="453">routes: critical to on-call-pager</text>
  <text class="sub" x="870" y="473">           others to team-chat</text>
  <text class="sub" x="870" y="493">inhibits noise when the app is down</text>

  <rect class="box" x="850" y="580" width="290" height="90" rx="10"/>
  <text class="title" x="870" y="610">alert-receiver  :5001</text>
  <text class="sub" x="870" y="633">lists firing and resolved notifications</text>
  <text class="sub" x="870" y="653">(stand-in for Slack / email / pager)</text>

  <path class="line" d="M455 445 L354 445" marker-end="url(#arrow)"/>
  <text class="lbl" x="404" y="435" text-anchor="middle">scrape</text>
  <text class="lbl" x="404" y="465" text-anchor="middle">/metrics</text>
  <path class="line" d="M745 445 L846 445" marker-end="url(#arrow)"/>
  <text class="lbl" x="796" y="435" text-anchor="middle">alerts</text>
  <text class="lbl" x="796" y="465" text-anchor="middle">fire/resolve</text>
  <path class="line" d="M995 510 L995 576" marker-end="url(#arrow)"/>
  <text class="lbl" x="1005" y="548">webhook</text>

  <path class="dash" d="M205 380 L205 350 L995 350 L995 376" marker-end="url(#arrow)"/>
  <text class="lbl" x="600" y="343" text-anchor="middle" fill="#0f766e">dashboard reads active alerts from the Alertmanager API and shows them as a banner</text>

  <path class="red" d="M1120 225 L1120 376" marker-end="url(#arrow-red)"/>
  <text class="lbl" x="1110" y="302" text-anchor="end" fill="#b91c1c">pipeline failure raises PipelineFailed alert</text>

  <text class="sub" x="60" y="560">Failure simulation (dashboard buttons or scripts/simulate.ps1):</text>
  <text class="sub" x="60" y="582">overheat, sensor offline, pollution spike, API errors, crash, docker stop</text>
  <text class="sub" x="60" y="614">Volumes: prometheus-data, alertmanager-data (survive redeploys)</text>
  <text class="sub" x="60" y="636">Images built per commit: sensor-dashboard:&lt;build&gt;, last good one tagged :stable</text>
</svg>
